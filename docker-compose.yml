name: stain-restore

services:
  web:
    build: .
    image: stain-restore:latest
    environment:
      PORT: 8080
      DATA_DIR: /app/data
    ports:
      # 宿主机端口可通过 APP_PORT 环境变量或 .env 文件配置，默认 8080
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # 一次性校验服务：自动执行代码测试、构建与领域求解冒烟，
  # 以退出码报告结果后自行退出。
  # 用法：docker compose run --rm verify
  #   或：docker compose up --exit-code-from verify verify
  verify:
    image: stain-restore:latest
    build: .
    command: ["npm", "run", "verify"]
    restart: "no"

volumes:
  app-data:
